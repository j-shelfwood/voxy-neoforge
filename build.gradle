// Validate mixin configuration (registration, exclusions, remap flags)
task validateMixinConfig(type: Exec) {
    description = 'Validates mixin registration, exclusions, and configuration'
    group = 'verification'

    commandLine 'python3', 'scripts/validate_mixin_config.py'

    // Only run if script exists
    onlyIf {
        file('scripts/validate_mixin_config.py').exists()
    }
}

// Validate mixin target signatures before compilation
task validateMixinSignatures(type: Exec) {
    description = 'Validates @Inject/@Shadow targets against Minecraft source'
    group = 'verification'

    commandLine 'python3', 'scripts/validate_mixin_targets.py'

    // Only run if script and MC sources exist
    onlyIf {
        file('scripts/validate_mixin_targets.py').exists() &&
        file('.reference/minecraft/1.21.1/decompiled').exists()
    }

    // Ignore failures if sources not available or script has issues (optional validation)
    ignoreExitValue = true
}

// Validate mixin configurations after JAR creation
task validateMixins(type: Exec) {
    dependsOn jar

    description = 'Validates that all mixins declared in JSON configs are present in the JAR'
    group = 'verification'

    commandLine 'bash', 'scripts/validate_mixins.sh'

    // Only run if script exists
    onlyIf {
        file('scripts/validate_mixins.sh').exists()
    }
}

// === VWGV2 bytecode patch (c2me deadlock fix) ===
// Mixin cannot @Redirect inside synthetic lambda methods, so we patch the
// VWGV2 jar directly at build time: change the executor passed to
// whenCompleteAsync from the MinecraftServer (which c2me can block via
// managedBlock) to ForkJoinPool.commonPool().  Also fixes a NetworkHandler
// SEND_POOL termination bug across integrated-server restarts.
if (hasVWGV2Jar) {
    def vwgv2Original = file('libs/voxyworldgen-neoforge-2.3.1.jar')
    def vwgv2Patched  = file('libs/voxyworldgen-neoforge-2.3.1-patched.jar')

    def patchVWGV2Compile = tasks.register('compilePatchVWGV2', JavaCompile) {
        description = 'Compiles the VWGV2 bytecode patcher'
        source = files('scripts/PatchVWGV2.java')
        // ASM is on the main compile classpath via NeoGradle → Mixin
        classpath = sourceSets.main.compileClasspath
        destinationDirectory = layout.buildDirectory.dir('patcher-classes')
        options.release = 21
    }

    tasks.register('patchVWGV2Jar', JavaExec) {
        description = 'Patches the VWGV2 jar to prevent c2me deadlocks'
        group = 'build'
        dependsOn patchVWGV2Compile

        inputs.file(vwgv2Original)
        outputs.file(vwgv2Patched)

        classpath = files(patchVWGV2Compile.get().destinationDirectory,
                          sourceSets.main.compileClasspath)
        mainClass = 'PatchVWGV2'
        args = [vwgv2Original.absolutePath, vwgv2Patched.absolutePath]
        // file existence is already checked by hasVWGV2Jar
    }

    // Compile against the patched jar so MixinChunkGenerationManager can
    // reference ChunkGenerationManager.  The mixin's @Inject for shutdown
    // order is applied at runtime; the c2me-deadlock fix is in the patched
    // jar itself (not a mixin — see PatchVWGV2.java).
    compileJava {
        dependsOn patchVWGV2Jar
        // swap the compileOnly reference from the original to the patched jar
        doFirst {
            def orig = files('libs/voxyworldgen-neoforge-2.3.1.jar')
            def patched = files(vwgv2Patched)
            classpath = classpath.minus(orig).plus(patched)
        }
    }
}

