    id 'net.neoforged.moddev' version "2.0.42-beta"
    id 'maven-publish'
}

def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// ── Optional libs/ dependencies (gitignored) ─────────────────────────
// These jars are not resolvable from public repositories (Modrinth
// NeoForge artifacts use thin bootstrap jars, not the real mod jar;
// VWGV2 has no Maven publishing).  On a clean checkout the build
// compiles without them; drop the jars in libs/ to enable full parity.

def hasSodiumJar  = file('libs/sodium-neoforge-0.8.12-beta.2-mod.jar').exists()
def hasIrisJar    = file('libs/iris-neoforge-1.8.14-beta.1.jar').exists()
def hasVWGV2Jar   = file('libs/voxyworldgen-neoforge-2.3.1.jar').exists()

// Exclude optional integrations from compilation - not all available for NeoForge 1.21.1
// These can be re-enabled once NeoForge versions become available
sourceSets {
    main {
        java {
            // === FULL-PARITY build. Exclude ONLY where the host mod has no usable NeoForge 1.21.1
            // === dependency, or a hard MC-1.21.1 API gap remains. Everything else is INCLUDED.
            //
            // INCLUDED (was excluded): Iris (compiled vs iris-neoforge 1.8.14, see libs/);
            // Sodium config GUI (SodiumConfigBuilder via Sodium 0.8.12 api.config).

            // ModMenu — pack has "ModMenu NeoForge Edition"; API bridge not wired yet. TODO parity.
            exclude 'me/cortex/voxy/client/config/ModMenuIntegration.java'

            // Flashback — no NeoForge build for 1.21.1 (host mod cannot run on NeoForge).
            exclude 'me/cortex/voxy/client/mixin/flashback/**'

            // Nvidium — Fabric-only, no NeoForge build (host mod cannot run on NeoForge).
            exclude 'me/cortex/voxy/client/mixin/nvidium/**'

            // (VoxyDebugScreenEntry.java deleted — stale 0.2.9 file using a 1.21.2+ debug API;
            //  the F3 overlay feature is provided by MixinDebugScreenOverlay, which is active.)

            // Blaze3D GlDebug mixin — GlDebug access gap on MC 1.21.1; revisit for parity.
            exclude 'me/cortex/voxy/client/mixin/minecraft/MixinGlDebug.java'

            // BlockableEventLoop mixin — isNonRecoverable() removed in MC 1.21.1.
            exclude 'me/cortex/voxy/client/mixin/minecraft/MixinBlockableEventLoop.java'

            // Exclude optional integrations when their compile-time jars are missing.
            // The mixin plugin (ClientVoxyMixinPlugin) gates the mixins at runtime too.
            if (!hasIrisJar) {
                exclude 'me/cortex/voxy/client/mixin/iris/**'
                exclude 'me/cortex/voxy/client/iris/**'
                exclude 'me/cortex/voxy/client/core/util/IrisUtil.java'
                exclude 'me/cortex/voxy/client/core/RenderPipelineFactory.java'
                exclude 'me/cortex/voxy/client/core/RenderProperties.java'
                exclude 'me/cortex/voxy/client/core/IrisVoxyRenderPipeline.java'
            }
            if (!hasVWGV2Jar) {
                exclude 'me/cortex/voxy/client/mixin/worldgen/**'
            }
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name "caffeinemcRepository"
                url "https://maven.caffeinemc.net/snapshots"
            }
        }
        filter {
            includeGroup "net.caffeinemc"
        }
    }

    // Forgified Fabric API for NeoForge
    maven {
        name = "Sinytra"
        url = "https://maven.su5ed.dev/releases"
    }

    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }

    exclusiveContent {
        forRepository {
            ivy {
                name = "github"
                url = "https://github.com/"
                patternLayout {
                    artifact '/[organisation]/[module]/releases/download/[revision]/[module]-[revision]-[classifier].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModuleByRegex("[^\\.]+", "nvidium")
        }
    }
}


def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}

def buildtime = {System.currentTimeSeconds()}

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version

    inputs.properties("version": version, "commit": hash, "buildtime": time)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": version, "commit": hash, "buildtime": time
    }

    // Exclude leftover Fabric metadata from NeoForge build
    exclude 'voxy.accesswidener'
}

neoForge {
    version = project.neoforge_version

    // Validate access transformers at build time to catch invalid targets
    validateAccessTransformers = true

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = "2024.11.17"
    }
}

def modRuntimeOnlyMsk = {arg->}
if (!isInGHA) {
    modRuntimeOnlyMsk = { arg ->
        dependencies {
            modRuntimeOnly(arg)
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    implementation "net.neoforged:neoforge:${project.neoforge_version}"

    // Forgified Fabric API for compatibility (includes Fabric Loader API)
    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.forgified_fabric_version}"

    // Sodium for NeoForge — target the pack's 0.8.12-beta.2 backport.
    // The Modrinth NeoForge artifact is a thin "sodium_service" bootstrap whose render
    // pipeline lives in META-INF/jarjar (NOT on the javac classpath). So we compile against
    // the extracted real mod jar (exact NeoForge/Mojmap-mapped classes); the user's installed
    // Sodium provides these classes at runtime. See libs/ (gitignored).
    if (hasSodiumJar) {
        compileOnly files('libs/sodium-neoforge-0.8.12-beta.2-mod.jar')
    }

    // Iris for NeoForge — compile against the pack's iris-neoforge 1.8.14 (ships classes directly,
    // unlike Sodium). voxy 0.2.15 targets iris 1.8.8; the 1.8.x internal API is compatible.
    // Provides net.irisshaders.iris.* for the shader-pack integration (full parity).
    if (hasIrisJar) {
        compileOnly files('libs/iris-neoforge-1.8.14-beta.1.jar')
    }

    // Voxy World Gen V2 — compile against its classes so our c2me fix mixin
    // (MixinChunkGenerationManager) can reference ChunkGenerationManager. Not bundled.
    if (hasVWGV2Jar) {
        compileOnly files('libs/voxyworldgen-neoforge-2.3.1.jar')
    }

    // Lithium for NeoForge (0.15.1 - latest for MC 1.21.1)
    implementation("maven.modrinth:lithium:mc1.21.1-0.15.1-neoforge")

    // SodiumOptionsAPI for Video Settings integration
    // Provides event API to add custom pages to Sodium's options GUI
    compileOnly("maven.modrinth:sodium-options-api:neoforge-1.21.1-1.0.10")

    // Reese's Sodium Options - required by SodiumOptionsAPI
    compileOnly("maven.modrinth:reeses-sodium-options:mc1.21.1-2.2.0+neoforge")

    // Optional mod dependencies - commented out for initial port
    // TODO: Add NeoForge versions when available
    //compileOnly "drouarb:nvidium:0.4.1-beta4:1.21.6@jar"
    //compileOnly("maven.modrinth:modmenu:17.0.0-alpha.1")
    //compileOnly("maven.modrinth:iris:1.10.4+1.21.11-neoforge")
    //compileOnly("maven.modrinth:chunky:1.4.54-neoforge")
    //compileOnly("maven.modrinth:vivecraft:1.21.9-1.3.2-neoforge")
    //compileOnly("maven.modrinth:flashback:rNCr1Rbs")
}


